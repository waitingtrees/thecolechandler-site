    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style-type: none;
        }

        :root {
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-size: clamp(16px, 2vmin, 24px);

        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #fff;
                --background-color: #00F;
                --wash1: rgba(255, 255, 255, 0.3);
                --wash2: rgba(255, 255, 255, 0.2);
            }

        body {
            font-size: var(--font-size);
            font-family: var(--font-family);
            line-height: var(--line-height);
            color: var(--text-color);
            background-color: var(--background-color);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .loading {
            padding: var(--padding);
            text-align: center;
            color: var(--text-color);
            opacity: 0.7;
        }

        .error {
            padding: var(--padding);
            text-align: center;
            color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            margin: var(--padding);
            border-radius: 8px;
        }

        .toggle {
            padding: var(--padding);
            display: flex;
            flex-direction: row;
            font-size: var(--font-size);
            line-height: var(--line-height);
            font-family: var(--font-family);
            background-color: transparent;
            border: none;
            outline: none;
            width: 100%;
            column-gap: var(--padding);
            cursor: pointer;
            color: var(--text-color);
            justify-content: space-between;
            align-items: center;
        }

        .toggle { transition: opacity 0.2s ease; }

        .toggle:hover {
            opacity: 0.7;
        }

        .bio {
            border-bottom: 1px solid var(--wash2);
        }

        .bioContent {
            display: grid;
            grid-template-rows: 0fr;
            overflow: hidden;
            transition: grid-template-rows 0.56s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .bioContent.active { grid-template-rows: 1fr; }
        .sectionInner { min-height: 0; overflow: hidden; }
        .bioBody { padding: 0 var(--padding) var(--padding); }

        /* Magic Swipe Animation */
        .char {
            opacity: 0;
            filter: blur(10px);
            transition: opacity 0.56s cubic-bezier(0.22, 1, 0.36, 1), filter 0.56s cubic-bezier(0.22, 1, 0.36, 1);
            transition-delay: calc(min(var(--char-index), 70) * 4ms);
        }

        .bioContent.active .char,
        .projectDetails.active .char {
            opacity: 1;
            filter: blur(0);
        }

        /* Reset delay on close so it blurs out instantly/uniformly */
        .bioContent:not(.active) .char,
        .projectDetails:not(.active) .char {
            transition-delay: 0ms;
            transition-duration: 0.38s;
        }

        .bioContent.active {
            opacity: 1;
            filter: blur(0);
        }

        h1,
        h2 {
            font-size: var(--font-size);
            text-align: left;
            flex: 1;
        }

        h1 {
            font-weight: 500;
        }

        h2 {
            font-weight: normal;
        }

        p {
            margin-bottom: 1em;
        }

        p:last-child {
            margin-bottom: 0;
        }

        p a {
            color: inherit;
            text-decoration: none;
        }

        p a:hover {

        }

        .projects {
            display: flex;
            width: 100%;
            flex-direction: column;
            flex-wrap: nowrap;
            margin: 0 auto;
        }

        .project {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--wash2);

        .project:last-child {
            border-bottom: none;
        }


        .projectDetails {
            display: grid;
            grid-template-rows: 0fr;
            overflow: hidden;
            transition: grid-template-rows 0.56s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .projectDetails.active {
            grid-template-rows: 1fr;
        }

        .attachments {
            display: flex;
            position: relative;
            align-items: flex-start;
            overflow-x: auto;
            padding: 0 var(--padding) var(--padding);
            cursor: grab;
        }

        .attachments.is-dragging {
            cursor: grabbing;
            user-select: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .bioContent, .projectDetails, .char,
            .attachment img, .attachment video {
                transition: none !important;
                transition-delay: 0ms !important;

        .attachments::-webkit-scrollbar {

        .attachments::-webkit-scrollbar-track {

        .attachmentsInner {
            display: flex;

        .description {
            min-width: 300px;

            padding-right: var(--padding);
            flex-shrink: 0;

        .attachment {
            position: relative;
            height: var(--image-height);
            flex-shrink: 0;
        }

        .attachment img,
        .attachment video {
            height: 100%;
            width: 100%;
            max-width: 90vw;
            object-fit: contain;

        }

        .attachment img,
        .attachment video {
            opacity: 0;
            transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1);

        .attachment .is-ready { opacity: 1; }

        .attachment-wrapper {
            height: 100%;
            position: relative;
            border: 1px solid var(--wash2);

        .text-link {
            border: 0;
            padding: 0;
            background: transparent;
            color: inherit;

        .contact-dialog {
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(520px, calc(100% - 32px));
            max-height: calc(100dvh - 32px);
            overflow-y: auto;
            padding: clamp(20px, 4vw, 32px);

        .contact-dialog[open] {

        @keyframes contact-enter {
            from { opacity: 0; transform: translateY(8px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .contact-dialog[open] { animation: none; }
        }

        .contact-dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .contact-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .contact-dialog h2 { font-weight: 500; }

        .contact-dialog label {
            display: block;
            margin-bottom: 18px;
        }

        .contact-dialog input,
        .contact-dialog textarea {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 0;
            background: transparent;
            color: inherit;
            font: inherit;
        }

        .contact-dialog textarea {
            min-height: 130px;
            resize: vertical;
        }

        .contact-dialog input:focus,
        .contact-dialog textarea:focus {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        .contact-dialog input::placeholder,
        .contact-dialog textarea::placeholder {

        }

        .contact-send {
            padding: 10px 18px;
            border: 1px solid white;
            background: white;
            color: var(--background-color);
            font: inherit;
            cursor: pointer;
        }

        .contact-send:disabled { opacity: 0.65; cursor: wait; }
        .contact-status { margin-top: 14px; margin-bottom: 0; }
        .contact-honey { display: none !important; }

        /* Rich text styles */
        .description h3 {
            font-size: 1.1em;
            margin: 1em 0 0.5em 0;
        }

        .description h3:first-child {
            margin-top: 0;
        }

        .description ul,

        .description li {

        .description blockquote {

        /* Mobile optimizations */

    </style>
</head>

<body>
    <div class="container" id="app">
        <div class="loading">Loading portfolio...</div>
    </div>

    <script>
        // Function to parse rich text (basic HTML support)
        function parseRichText(text) {
            if (!text) return '';

            // Convert line breaks
            text = text.replace(/\n\n/g, '</p><p>');
            text = text.replace(/\n/g, '<br>');

            // Convert markdown-style formatting
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Wrap in paragraph if not already
            if (!text.startsWith('<p>')) {
                text = '<p>' + text + '</p>';
            }

            return text;
        }

        const mediaLoader = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.target.closest('.projectDetails.active')) {
                    loadMedia(entry.target);
                }
            });
        }, { rootMargin: '200px', threshold: 0 });

        const videoPlayback = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting && video.closest('.projectDetails.active') &&
                    !document.hidden && !document.querySelector('dialog[open]')) {
                    loadMedia(video);
                    video.play().catch(() => { video.controls = true; });
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.01 });

        function loadMedia(media) {
            if (!media.getAttribute('src') && media.dataset.src) {
                const ready = () => media.classList.add('is-ready');
                media.addEventListener(media.tagName === 'VIDEO' ? 'loadeddata' : 'load', ready, { once: true });
                media.addEventListener('error', ready, { once: true });
                media.src = media.dataset.src;
            }
        }

        function pauseVideos(section = document) {
            section.querySelectorAll('video').forEach(video => video.pause());
        }

        function observeSectionMedia(section) {
            section.querySelectorAll('[data-src]').forEach(media => {
                mediaLoader.unobserve(media);
                mediaLoader.observe(media);
                if (media.tagName === 'VIDEO') {
                    videoPlayback.unobserve(media);
                    videoPlayback.observe(media);
                }
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pauseVideos();
            else document.querySelectorAll('.projectDetails.active').forEach(observeSectionMedia);
        });

        function setSectionOpen(section, open) {
            section.classList.toggle('active', open);
            section.inert = !open;
            const button = document.querySelector(`[aria-controls="${section.id}"]`);
            button?.setAttribute('aria-expanded', String(open));
            if (open) observeSectionMedia(section);
            else pauseVideos(section);
        }

        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const open = !section.classList.contains('active');
            document.querySelectorAll('.bioContent, .projectDetails').forEach(other => {
                if (other !== section && other.classList.contains('active')) setSectionOpen(other, false);
            });
            setSectionOpen(section, open);
        }

        function setupGalleryDrag() {
            document.querySelectorAll('.attachments').forEach(container => {
                let drag = null;
                const finish = () => {
                    drag = null;
                    container.classList.remove('is-dragging');
                };
                container.addEventListener('pointerdown', event => {
                    if (event.pointerType !== 'mouse' || event.button !== 0) return;
                    drag = { x: event.clientX, scroll: container.scrollLeft };
                });
                container.addEventListener('pointermove', event => {
                    if (!drag) return;
                    const distance = event.clientX - drag.x;
                    if (Math.abs(distance) < 4 && !container.classList.contains('is-dragging')) return;
                    container.classList.add('is-dragging');
                    container.setPointerCapture(event.pointerId);
                    event.preventDefault();
                    container.scrollLeft = drag.scroll - distance;
                });
                container.addEventListener('pointerup', finish);
                container.addEventListener('pointercancel', finish);
                container.addEventListener('lostpointercapture', finish);
                container.addEventListener('pointerleave', event => {
                    if (!container.hasPointerCapture(event.pointerId)) finish();
                });
            });
        }

        // Function to render the portfolio
        function renderPortfolio(data) {
            const container = document.getElementById('app');
            let html = '';

            // Bio Section
            if (data.general) {
                html += `
                    <div class="bio">
                        <button class="toggle" onclick="toggleSection('bio')" aria-controls="bio" aria-expanded="false">
                            <h1>${data.general.displayName || 'Portfolio'}</h1>
                        </button>
                        <div class="bioContent" id="bio" inert><div class="sectionInner"><div class="bioBody">
                `;

                if (data.general.about) {
                    html += parseRichText(data.general.about);
                }

                if (data.contact && data.contact.length > 0) {
                    html += '<p>';
                    data.contact.forEach((contact, index) => {
                        if (contact.platform === 'Contact') {
                            html += '<button type="button" class="text-link" data-open-contact aria-haspopup="dialog" aria-controls="contact-dialog">Contact</button>';
                        } else {
                            const linkAttributes = /^https?:/i.test(contact.url)
                                ? ' target="_blank" rel="noopener noreferrer"'
                                : '';
                            html += `<a href="${contact.url}"${linkAttributes}>${contact.platform}</a>`;
                        }
                        if (index < data.contact.length - 1) {
                            html += ', ';
                        }
                    });
                    html += '</p>';
                }

                html += `
                        </div></div></div>
                    </div>
                `;
            }

            // Projects Section
            html += '<div class="projects">';

            // Combine projects and sideProjects
            const allProjects = [];
            if (data.projects) allProjects.push(...data.projects);
            if (data.sideProjects) allProjects.push(...data.sideProjects);

            // Lead with commercial work that supports repeat client engagements.
            allProjects.sort((a, b) => {
                return (a.displayOrder ?? Infinity) - (b.displayOrder ?? Infinity);
            });

            // Render each project
            allProjects.forEach((project, index) => {
                // Skip projects without attachments
                if (!project.attachments || project.attachments.length === 0) {
                    return;
                }

                const projectId = `project-${index}`;

                html += `
                    <div class="project">
                        <button class="toggle" onclick="toggleSection('${projectId}')" aria-controls="${projectId}" aria-expanded="false">
                            <h2>${project.title || 'Untitled Project'}</h2>
                        </button>
                        <div class="projectDetails" id="${projectId}" inert>
                            <div class="sectionInner"><div class="attachments">
                                <div class="attachmentsInner">
                `;

                // Add description if exists
                if (project.description) {
                    html += `
                        <div class="description">
                            ${parseRichText(project.description)}
                        </div>
                    `;
                }

                // Add attachments
                project.attachments.forEach(attachment => {
                    const width = Number(attachment.width) || 1920;
                    const height = Number(attachment.height) || 1080;
                    const mediaWidth = `width: min(calc(var(--image-height) * ${width / height}), 90vw)`;
                    // Remove leading slash from URL since it starts with /content/media/
                    const mediaPath = attachment.url.startsWith('http') ?
                        attachment.url :
                        attachment.url.substring(1);  // Remove the leading /

                    if (attachment.type === 'video') {
                        html += `
                            <div class="attachment">
                                <div class="attachment-wrapper" style="${mediaWidth}">
                                    <video data-src="${mediaPath}" width="${width}" height="${height}" preload="none" muted loop playsinline></video>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="attachment">
                                <div class="attachment-wrapper" style="${mediaWidth}">
                                    <img data-src="${mediaPath}" width="${width}" height="${height}" alt="${project.title}" decoding="async" draggable="false">
                                </div>
                            </div>
                        `;
                    }
                });

                html += `
                                </div>
                            </div></div>
                        </div>
                    </div>
                `;
            });

            html += `</div>
                <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-heading">
                    <div class="contact-header">
                        <h2 id="contact-heading">Tell me about your project.</h2>
                        <button type="button" class="text-link" data-close-contact aria-label="Close contact form">Close</button>
                    </div>
                    <form id="contact-form" action="https://formsubmit.co/colechandler0@gmail.com" method="POST">
                        <input type="hidden" name="_subject" value="New project inquiry — thecolechandler.com">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="text" name="_honey" class="contact-honey" tabindex="-1" autocomplete="off" aria-hidden="true">
                        <label for="contact-name">Name
                            <input id="contact-name" name="name" autocomplete="name" maxlength="120" required autofocus>
                        </label>
                        <label for="contact-email">Email
                            <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
                        </label>
                        <label for="contact-message">Message
                            <textarea id="contact-message" name="message" maxlength="5000" placeholder="What are you working on?" required></textarea>
                        </label>
                        <button class="contact-send" type="submit">Send message</button>
                        <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
                    </form>
                </dialog>`;

            container.innerHTML = html;

            const dialog = document.getElementById('contact-dialog');
            document.querySelector('[data-open-contact]')?.addEventListener('click', () => {
                pauseVideos();
                dialog.showModal();
            });
            dialog.addEventListener('close', () => {
                document.querySelectorAll('.projectDetails.active').forEach(observeSectionMedia);
            });
            setupGalleryDrag();
            document.querySelector('[data-close-contact]').addEventListener('click', () => dialog.close());
            document.getElementById('contact-form').addEventListener('submit', sendInquiry);
        }

        async function sendInquiry(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const button = form.querySelector('[type="submit"]');
            const status = document.getElementById('contact-status');
            if (button.disabled) return;
            const payload = Object.fromEntries(new FormData(form));
            if (payload._honey) return;
            payload._replyto = payload.email;
            button.disabled = true;
            button.textContent = 'Sending…';
            form.setAttribute('aria-busy', 'true');
            status.textContent = '';
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);
            try {
                const response = await fetch(form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                const result = await response.json();
                if (!response.ok || ![true, 'true'].includes(result.success) || /activat/i.test(result.message || '')) {
                    throw new Error('Delivery not confirmed');
                }
                form.reset();
                status.textContent = 'Message sent. Thanks—I’ll be in touch.';
            } catch (error) {
                status.textContent = 'Your message couldn’t be sent. Please try again in a moment.';
            } finally {
                clearTimeout(timeout);
                button.disabled = false;
                button.textContent = 'Send message';
                form.removeAttribute('aria-busy');
            }
        }

        // Load the profile data
        fetch('content/profileData.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Could not load profileData.json');
                }
                return response.json();
            })
            .then(data => {
                renderPortfolio(data);

                // Apply magic swipe to bio and projects
                // We need to do this AFTER rendering
                const sectionsToAnimate = document.querySelectorAll('.bioContent, .projectDetails');
                sectionsToAnimate.forEach(section => {
                    splitTextToChars(section);
                    applyCharIndices(section);
                });

                // Open bio by default
                setTimeout(() => {
                    setSectionOpen(document.getElementById('bio'), true);
                }, 100);
            })
            .catch(error => {
                console.error('Error loading portfolio:', error);
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <h2>Error Loading Portfolio</h2>
                        <p>${error.message}</p>
                        <p>Make sure your profileData.json file is in the content folder.</p>
                    </div>
                `;
            });

        // Helper to split text nodes into spans
        function splitTextToChars(element) {
            if (element.nodeType === 3) { // Text node
                const text = element.nodeValue;
                if (!text.trim()) return; // Skip empty text

                const fragment = document.createDocumentFragment();

                for (let char of text) {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = 'char';
                    if (char === ' ') {
                        span.style.whiteSpace = 'pre-wrap'; // Preserve spaces but allow wrapping
                    }
                    fragment.appendChild(span);
                }
                element.parentNode.replaceChild(fragment, element);
            } else if (element.nodeType === 1) { // Element node
                // Recursively split children
                // Convert to array first because childNodes is live
                Array.from(element.childNodes).forEach(splitTextToChars);
            }
        }

        // Apply indices to all chars in a container
        function applyCharIndices(container) {
            const chars = container.querySelectorAll('.char');
            chars.forEach((char, index) => {
                char.style.setProperty('--char-index', index);
            });
        }

    </script>
</body>
