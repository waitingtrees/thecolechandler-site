<!DOCTYPE html>
<html lang="en">

<head>

    <meta property="og:description"
        content="Professional videographer, cinematographer, and editor based in Tulsa, Oklahoma. Specializing in corporate, commercial, and event video production.">

    <!-- Twitter -->

    <meta property="twitter:description"
        content="Professional videographer, cinematographer, and editor based in Tulsa, Oklahoma. Specializing in corporate, commercial, and event video production.">
    <meta property="twitter:image" content="https://thecolechandler.com/content/media/profilePhoto.jpg">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "name": "Cole Chandler",
          "url": "https://thecolechandler.com",
          "image": "https://thecolechandler.com/content/media/profilePhoto.jpg",
          "jobTitle": "Videographer",
          "worksFor": {
            "@type": "Organization",
            "name": "Freelance"
          },
          "sameAs": [

            "https://www.linkedin.com/in/thecolechandler"
          ]
        },
        {
          "@type": "ProfessionalService",
          "name": "Cole Chandler Videography",
          "image": "https://thecolechandler.com/content/media/profilePhoto.jpg",
          "url": "https://thecolechandler.com",
          "telephone": "",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Tulsa",
            "addressRegion": "OK",

          },

        }
      ]
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style-type: none;
        }

        :root {
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-size: clamp(16px, 2vmin, 24px);
            --text-color: #fff;
            --line-height: 1.6;
            --background-color: #00F;
            --image-height: 50vh;
            --padding: clamp(16px, 3vmin, 32px);
            --wash1: rgba(0, 0, 0, 0.1);
            --wash2: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #fff;
                --background-color: #00F;
                --wash1: rgba(255, 255, 255, 0.3);
                --wash2: rgba(255, 255, 255, 0.2);
            }
        }

        body {
            font-size: var(--font-size);
            font-family: var(--font-family);
            line-height: var(--line-height);
            color: var(--text-color);
            background-color: var(--background-color);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .loading {
            padding: var(--padding);
            text-align: center;
            color: var(--text-color);
            opacity: 0.7;
        }

        .error {
            padding: var(--padding);
            text-align: center;
            color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            margin: var(--padding);
            border-radius: 8px;
        }

        .toggle {
            padding: var(--padding);
            display: flex;
            flex-direction: row;
            font-size: var(--font-size);
            line-height: var(--line-height);
            font-family: var(--font-family);
            background-color: transparent;
            border: none;
            outline: none;
            width: 100%;
            column-gap: var(--padding);
            cursor: pointer;
            color: var(--text-color);
            justify-content: space-between;
            align-items: center;
        }

        .toggle:hover {
            opacity: 0.7;
        }

        .bio {
            border-bottom: 1px solid var(--wash2);
        }

        .bioContent {
            padding: 0 var(--padding) var(--padding);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .bioContent.active {
            max-height: 1000px;
        }

        /* Magic Swipe Animation */
        .char {
            opacity: 0;
            filter: blur(10px);
            transition: opacity 0.5s ease, filter 0.5s ease;
            transition-delay: calc(var(--char-index) * 5ms);
        }

        .bioContent.active .char,
        .projectDetails.active .char {
            opacity: 1;
            filter: blur(0);
        }

        /* Reset delay on close so it blurs out instantly/uniformly */
        .bioContent:not(.active) .char,
        .projectDetails:not(.active) .char {
            transition-delay: 0ms;
            transition-duration: 0.3s;
        }

        .bioContent.active {
            max-height: 1000px;
            opacity: 1;
            filter: blur(0);
        }

        h1,
        h2 {
            font-size: var(--font-size);
            text-align: left;
            flex: 1;
        }

        h1 {
            font-weight: 500;
        }

        h2 {
            font-weight: normal;
        }

        p {
            margin-bottom: 1em;
        }

        p:last-child {
            margin-bottom: 0;
        }

        p a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid var(--wash1);
        }

        p a:hover {
            opacity: 0.7;
        }

        .projects {
            display: flex;
            width: 100%;
            flex-direction: column;
            flex-wrap: nowrap;
            margin: 0 auto;
        }

        .project {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--wash2);
        }

        .project:last-child {
            border-bottom: none;
        }


        .projectDetails {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .projectDetails.active {
            max-height: 3000px;
        }

        .attachments {
            display: flex;
            position: relative;
            align-items: flex-start;
            overflow-x: auto;
            padding: 0 var(--padding) var(--padding);
            cursor: grab;
        }

        .attachments:active {
            cursor: grabbing;
        }

        .attachments::-webkit-scrollbar {
            height: 8px;
        }

        .attachments::-webkit-scrollbar-track {
            background: var(--wash2);
        }

        .attachments::-webkit-scrollbar-thumb {
            background: var(--wash1);
            border-radius: 4px;
        }

        .attachmentsInner {
            display: flex;
            flex-direction: row;
            gap: var(--padding);
            flex-wrap: nowrap;
            align-items: flex-start;
        }

        .description {
            min-width: 300px;
            max-width: 500px;
            padding-right: var(--padding);
            flex-shrink: 0;
        }

        .attachment {
            position: relative;
            height: var(--image-height);
            flex-shrink: 0;
        }

        .attachment img,
        .attachment video {
            height: 100%;
            width: auto;
            max-width: 90vw;
            object-fit: contain;
            display: block;
        }

        .attachment-wrapper {
            height: 100%;
            position: relative;
            border: 1px solid var(--wash2);
            background: var(--wash2);
        }

        .text-link {
            border: 0;
            border-bottom: 1px solid var(--wash1);
            padding: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            line-height: inherit;
            cursor: pointer;
        }

        .text-link:hover { opacity: 0.7; }

        .text-link:focus-visible,
        .contact-dialog button:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 4px;
        }

        .contact-dialog {
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(520px, calc(100% - 32px));
            max-height: calc(100dvh - 32px);
            overflow-y: auto;
            padding: clamp(20px, 4vw, 32px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: var(--background-color);
            color: var(--text-color);
            font: inherit;
        }

        .contact-dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .contact-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .contact-dialog h2 { font-weight: 500; }

        .contact-dialog label {
            display: block;
            margin-bottom: 18px;
        }

        .contact-dialog input,
        .contact-dialog textarea {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 0;
            background: transparent;
            color: inherit;
            font: inherit;
        }

        .contact-dialog textarea {
            min-height: 130px;
            resize: vertical;
        }

        .contact-dialog input:focus,
        .contact-dialog textarea:focus {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        .contact-dialog input::placeholder,
        .contact-dialog textarea::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .contact-send {
            padding: 10px 18px;
            border: 1px solid white;
            background: white;
            color: var(--background-color);
            font: inherit;
            cursor: pointer;
        }

        .contact-send:disabled { opacity: 0.65; cursor: wait; }
        .contact-status { margin-top: 14px; margin-bottom: 0; }
        .contact-honey { display: none !important; }

        /* Rich text styles */
        .description h3 {
            font-size: 1.1em;
            margin: 1em 0 0.5em 0;
        }

        .description h3:first-child {
            margin-top: 0;
        }

        .description ul,
        .description ol {
            margin: 1em 0;
            padding-left: 1.5em;
        }

        .description li {
            list-style: disc;
            margin: 0.5em 0;
        }

        .description ol li {
            list-style: decimal;
        }

        .description blockquote {
            border-left: 3px solid var(--wash1);
            padding-left: 1em;
            margin: 1em 0;
            font-style: italic;
        }

        .description strong {
            font-weight: 600;
        }

        .description em {
            font-style: italic;
        }

        .description code {
            background: var(--wash2);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .description {
                min-width: 80vw;
                max-width: 80vw;
            }

            .attachment {
                height: 40vh;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="app">
        <div class="loading">Loading portfolio...</div>
    </div>

    <script>
        // Function to parse rich text (basic HTML support)
        function parseRichText(text) {
            if (!text) return '';

            // Convert line breaks
            text = text.replace(/\n\n/g, '</p><p>');
            text = text.replace(/\n/g, '<br>');

            // Convert markdown-style formatting
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Wrap in paragraph if not already
            if (!text.startsWith('<p>')) {
                text = '<p>' + text + '</p>';
            }

            return text;
        }

        // Function to toggle sections
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const allSections = document.querySelectorAll('.bioContent, .projectDetails');

            // Close all other sections
            allSections.forEach(s => {
                if (s.id !== sectionId) {
                    s.classList.remove('active');
                }
            });

            // Toggle current section
            section.classList.toggle('active');
        }

        // Function to render the portfolio
        function renderPortfolio(data) {
            const container = document.getElementById('app');
            let html = '';

            // Bio Section
            if (data.general) {
                html += `
                    <div class="bio">
                        <button class="toggle" onclick="toggleSection('bio')">
                            <h1>${data.general.displayName || 'Portfolio'}</h1>
                            <span>Info</span>
                        </button>
                        <div class="bioContent" id="bio">
                `;

                if (data.general.about) {
                    html += parseRichText(data.general.about);
                }

                if (data.contact && data.contact.length > 0) {
                    html += '<p>';
                    data.contact.forEach((contact, index) => {
                        if (contact.platform === 'Contact') {
                            html += '<button type="button" class="text-link" data-open-contact aria-haspopup="dialog" aria-controls="contact-dialog">Contact</button>';
                        } else {
                            const linkAttributes = /^https?:/i.test(contact.url)
                                ? ' target="_blank" rel="noopener noreferrer"'
                                : '';
                            html += `<a href="${contact.url}"${linkAttributes}>${contact.platform}</a>`;
                        }
                        if (index < data.contact.length - 1) {
                            html += ', ';
                        }
                    });
                    html += '</p>';
                }

                html += `
                        </div>
                    </div>
                `;
            }

            // Projects Section
            html += '<div class="projects">';

            // Combine projects and sideProjects
            const allProjects = [];
            if (data.projects) allProjects.push(...data.projects);
            if (data.sideProjects) allProjects.push(...data.sideProjects);

            // Lead with commercial work that supports repeat client engagements.
            allProjects.sort((a, b) => {
                return (a.displayOrder ?? Infinity) - (b.displayOrder ?? Infinity);
            });

            // Render each project
            allProjects.forEach((project, index) => {
                // Skip projects without attachments
                if (!project.attachments || project.attachments.length === 0) {
                    return;
                }

                const projectId = `project-${index}`;

                html += `
                    <div class="project">
                        <button class="toggle" onclick="toggleSection('${projectId}')">
                            <h2>${project.title || 'Untitled Project'}</h2>
                        </button>
                        <div class="projectDetails" id="${projectId}">
                            <div class="attachments">
                                <div class="attachmentsInner">
                `;

                // Add description if exists
                if (project.description) {
                    html += `
                        <div class="description">
                            ${parseRichText(project.description)}
                        </div>
                    `;
                }

                // Add attachments
                project.attachments.forEach(attachment => {
                    // Remove leading slash from URL since it starts with /content/media/
                    const mediaPath = attachment.url.startsWith('http') ?
                        attachment.url :
                        attachment.url.substring(1);  // Remove the leading /

                    if (attachment.type === 'video') {
                        html += `
                            <div class="attachment">
                                <div class="attachment-wrapper">
                                    <video src="${mediaPath}" autoplay muted loop playsinline></video>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="attachment">
                                <div class="attachment-wrapper">
                                    <img src="${mediaPath}" alt="${project.title}" loading="lazy">
                                </div>
                            </div>
                        `;
                    }
                });

                html += `
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>
                <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-heading">
                    <div class="contact-header">
                        <h2 id="contact-heading">Tell me about your project.</h2>
                        <button type="button" class="text-link" data-close-contact aria-label="Close contact form">Close</button>
                    </div>
                    <form id="contact-form" action="https://formsubmit.co/colechandler0@gmail.com" method="POST">
                        <input type="hidden" name="_subject" value="New project inquiry — thecolechandler.com">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="text" name="_honey" class="contact-honey" tabindex="-1" autocomplete="off" aria-hidden="true">
                        <label for="contact-name">Name
                            <input id="contact-name" name="name" autocomplete="name" maxlength="120" required autofocus>
                        </label>
                        <label for="contact-email">Email
                            <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
                        </label>
                        <label for="contact-message">Message
                            <textarea id="contact-message" name="message" maxlength="5000" placeholder="What are you working on?" required></textarea>
                        </label>
                        <button class="contact-send" type="submit">Send message</button>
                        <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
                    </form>
                </dialog>`;

            container.innerHTML = html;

            const dialog = document.getElementById('contact-dialog');
            document.querySelector('[data-open-contact]')?.addEventListener('click', () => dialog.showModal());
            document.querySelector('[data-close-contact]').addEventListener('click', () => dialog.close());
            document.getElementById('contact-form').addEventListener('submit', sendInquiry);
        }

        async function sendInquiry(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const button = form.querySelector('[type="submit"]');
            const status = document.getElementById('contact-status');
            if (button.disabled) return;
            const payload = Object.fromEntries(new FormData(form));
            if (payload._honey) return;
            payload._replyto = payload.email;
            button.disabled = true;
            button.textContent = 'Sending…';
            form.setAttribute('aria-busy', 'true');
            status.textContent = '';
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);
            try {
                const response = await fetch(form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                const result = await response.json();
                if (!response.ok || ![true, 'true'].includes(result.success) || /activat/i.test(result.message || '')) {
                    throw new Error('Delivery not confirmed');
                }
                form.reset();
                status.textContent = 'Message sent. Thanks—I’ll be in touch.';
            } catch (error) {
                status.textContent = 'Your message couldn’t be sent. Please try again in a moment.';
            } finally {
                clearTimeout(timeout);
                button.disabled = false;
                button.textContent = 'Send message';
                form.removeAttribute('aria-busy');
            }
        }

        // Load the profile data
        fetch('content/profileData.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Could not load profileData.json');
                }
                return response.json();
            })
            .then(data => {
                renderPortfolio(data);

                // Apply magic swipe to bio and projects
                // We need to do this AFTER rendering
                const sectionsToAnimate = document.querySelectorAll('.bioContent, .projectDetails');
                sectionsToAnimate.forEach(section => {
                    splitTextToChars(section);
                    applyCharIndices(section);
                });

                // Open bio by default
                setTimeout(() => {
                    document.getElementById('bio').classList.add('active');
                }, 100);
            })
            .catch(error => {
                console.error('Error loading portfolio:', error);
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <h2>Error Loading Portfolio</h2>
                        <p>${error.message}</p>
                        <p>Make sure your profileData.json file is in the content folder.</p>
                    </div>
                `;
            });

        // Helper to split text nodes into spans
        function splitTextToChars(element) {
            if (element.nodeType === 3) { // Text node
                const text = element.nodeValue;
                if (!text.trim()) return; // Skip empty text

                const fragment = document.createDocumentFragment();

                for (let char of text) {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = 'char';
                    if (char === ' ') {
                        span.style.whiteSpace = 'pre-wrap'; // Preserve spaces but allow wrapping
                    }
                    fragment.appendChild(span);
                }
                element.parentNode.replaceChild(fragment, element);
            } else if (element.nodeType === 1) { // Element node
                // Recursively split children
                // Convert to array first because childNodes is live
                Array.from(element.childNodes).forEach(splitTextToChars);
            }
        }

        // Apply indices to all chars in a container
        function applyCharIndices(container) {
            const chars = container.querySelectorAll('.char');
            chars.forEach((char, index) => {
                char.style.setProperty('--char-index', index);
            });
        }

        // Add horizontal scroll with mouse drag
        document.addEventListener('DOMContentLoaded', () => {
            const attachmentContainers = document.querySelectorAll('.attachments');

            attachmentContainers.forEach(container => {
                let isDown = false;
                let startX;
                let scrollLeft;

                container.addEventListener('mousedown', (e) => {
                    isDown = true;
                    startX = e.pageX - container.offsetLeft;
                    scrollLeft = container.scrollLeft;
                });

                container.addEventListener('mouseleave', () => {
                    isDown = false;
                });

                container.addEventListener('mouseup', () => {
                    isDown = false;
                });

                container.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - container.offsetLeft;
                    const walk = (x - startX) * 2;
                    container.scrollLeft = scrollLeft - walk;
                });
            });
        });
    </script>
</body>
